[mgr]
show_hidden = true
show_symlink = true

[opener]
play = [
	{ run = 'open -a IINA "@"', orphan = true, for = "unix" },
	{ run = '"C:\Program Files\mpv.exe" %*', orphan = true, for = "windows" }
]
edit = [
	{ run = '$EDITOR "$@"', block = true, for = "unix" },
	{ run = "%EDITOR% %*",  block = true, for = "windows" },
]
open = [
	{ run = 'xdg-open "$@"', desc = "Open" },
]

[open]
rules = [
	{ mime = "text/*", use = "edit" },
	{ mime = "video/*", use = "play" },

	# { mime = "application/json", use = "edit" },
	{ url = "*.json", use = "edit" },

	# Multiple openers for a single rule
	{ url = "*.html", use = [ "open", "edit" ] },
]
[plugin]
prepend_previewers = [
	{ mime = "image/heic", run = "heic" },
]
[[plugin.prepend_fetchers]]
#id    = "mime" # Remove if Yazi > v26.1.22
url   = "local://*"
run   = "mime-ext.local"
prio  = "high"
group = "mime"

[[plugin.prepend_fetchers]]
#id    = "mime" # Remove if Yazi > v26.1.22
url   = "remote://*"
run   = "mime-ext.remote"
prio  = "high"
group = "mime"
